<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculadora</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eeeeee;
        }

        header {
            color: rgb(0, 0, 0);
            text-align: center;
            padding: 18px;
        }

        h1 {
            margin: 5px;
        }

        .contenedor {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 25px 15px;
            flex-wrap: wrap;
        }

        .panel {
            width: 310px;
            padding: 20px;
            border-radius: 7px;
            border: 1px solid #cccccc;
        }

        h2 {
            font-size: 21px;
            margin-top: 0;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 7px 0;
            box-sizing: border-box;
            border: 1px solid #aaaaaa;
            border-radius: 4px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 3px #00000000;
        }

        .botones {
            margin-top: 10px;
        }

        button {
            background-color: #000000;
            color: white;
            border: none;
            padding: 10px 13px;
            margin: 3px 2px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background-color: #d83636;
        }

        button:active {
            transform: scale(0.97);
        }

        .resultado {
            background-color: #f2f2f2;
            margin-top: 12px;
        }

        @media (max-width: 600px) {
            .panel {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>calculadora</h1>
</header>

<div class="contenedor">

    <div class="panel">
        <h2>panel 1: numeros</h2>

        <input type="number" id="numero1">
        <input type="number" id="numero2">

        <div class="botones">
            <button onclick="sumar()">sumar</button>
            <button onclick="restar()">restar</button>
            <button onclick="multiplicar()">multiplicar</button>
            <button onclick="dividir()">dividir</button>
            <button onclick="raiz()">raiz</button>
            <button onclick="esMultiplo()">multiplo</button>
            <button onclick="compararNumeros()">comparar</button>
        </div>

        <input type="text" id="resultadoNumeros" class="resultado" readonly>
    </div>

    <div class="panel">
        <h2>panel 2: textos</h2>

        <input type="text" id="texto1">
        <input type="text" id="texto2">

        <div class="botones">
            <button onclick="compararTextos()">comparar</button>
            <button onclick="contar()">contar</button>
            <button onclick="espacios()">espacios</button>
            <button onclick="insertar()">nsertar</button>
        </div>

        <input type="text" id="resultadoTextos" class="resultado" readonly>
    </div>

    <div class="panel">
        <h2>panel 3: vectores</h2>

        <input type="text" id="vector">

        <div class="botones">
            <button onclick="crear()">Crear</button>
            <button onclick="sumarVector()">Sumar</button>
            <button onclick="pares()">Pares</button>
        </div>

        <input type="text" id="resultadoVector" class="resultado" readonly>
    </div>

</div>

<script>

    function sumar() {
        var n1 = document.getElementById("numero1").value;
        var n2 = document.getElementById("numero2").value;

        if (n1 !== "" && n2 !== "") {
            document.getElementById("resultadoNumeros").value =
                Number(n1) + Number(n2);
        } else {
            alert("ingrese los dos valores");
        }
    }

    function restar() {
        var n1 = document.getElementById("numero1").value;
        var n2 = document.getElementById("numero2").value;

        if (n1 !== "" && n2 !== "") {
            document.getElementById("resultadoNumeros").value =
                Number(n1) - Number(n2);
        } else {
            alert("ingrese los dos valores");
        }
    }

    function multiplicar() {
        var n1 = document.getElementById("numero1").value;
        var n2 = document.getElementById("numero2").value;

        if (n1 !== "" && n2 !== "") {
            document.getElementById("resultadoNumeros").value =
                Number(n1) * Number(n2);
        } else {
            alert("ingrese los dos valores");
        }
    }

    function dividir() {
        var n1 = document.getElementById("numero1").value;
        var n2 = document.getElementById("numero2").value;

        if (n1 !== "" && n2 !== "") {
            if (Number(n2) !== 0) {
                document.getElementById("resultadoNumeros").value =
                    Number(n1) / Number(n2);
            } else {
                alert("no se puede dividir entre cero");
            }
        } else {
            alert("ingrese los dos valores");
        }
    }

    function raiz() {
        var n1 = document.getElementById("numero1").value;

        if (n1 !== "") {
            if (Number(n1) >= 0) {
                document.getElementById("resultadoNumeros").value =
                    Math.sqrt(Number(n1));
            } else {
                alert("no se puede sacar raiz de un numero negativo");
            }
        } else {
            alert("ingrese el primer valor");
        }
    }

    function esMultiplo() {
        var n1 = document.getElementById("numero1").value;
        var n2 = document.getElementById("numero2").value;

        if (n1 !== "" && n2 !== "") {
            if (Number(n2) !== 0) {
                if (Number(n1) % Number(n2) === 0) {
                    document.getElementById("resultadoNumeros").value =
                        n1 + " es multiplo de " + n2;
                } else {
                    document.getElementById("resultadoNumeros").value =
                        n1 + " no es multiplo de " + n2;
                }
            } else {
                alert("el segundo valor no puede ser cero");
            }
        } else {
            alert("ingrese los dos valores");
        }
    }

    function compararNumeros() {
        var n1 = document.getElementById("numero1").value;
        var n2 = document.getElementById("numero2").value;

        if (n1 !== "" && n2 !== "") {
            if (Number(n1) > Number(n2)) {
                document.getElementById("resultadoNumeros").value =
                    "el mayor es " + n1;
            } else if (Number(n2) > Number(n1)) {
                document.getElementById("resultadoNumeros").value =
                    "el mayor es " + n2;
            } else {
                document.getElementById("resultadoNumeros").value =
                    "los dos valores son iguales";
            }
        } else {
            alert("ingrese los dos valores");
        }
    }

    function compararTextos() {
        var t1 = document.getElementById("texto1").value;
        var t2 = document.getElementById("texto2").value;

        if (t1 !== "" && t2 !== "") {
            if (t1.length > t2.length) {
                document.getElementById("resultadoTextos").value =
                    "El texto 1 es mas largo";
            } else if (t2.length > t1.length) {
                document.getElementById("resultadoTextos").value =
                    "El texto 2 es mas largo";
            } else {
                document.getElementById("resultadoTextos").value =
                    "los textos tienen el mismo tamaño";
            }
        } else {
            alert("ingrese los dos textos");
        }
    }

    function contar() {
        var t1 = document.getElementById("texto1").value;
        var t2 = document.getElementById("texto2").value;

        if (t1 !== "" && t2 !== "") {
            if (t2.length === 1) {
                var cantidad = 0;

                for (var i = 0; i < t1.length; i++) {
                    if (t1.charAt(i) === t2) {
                        cantidad++;
                    }
                }

                if (cantidad > 0) {
                    document.getElementById("resultadoTextos").value =
                        "Encontrado " + cantidad + " veces";
                } else {
                    document.getElementById("resultadoTextos").value =
                        "El caracter no fue encontrado";
                }
            } else {
                alert("ingrese un solo caracter en el segundo campo");
            }
        } else {
            alert("ingrese los dos campos");
        }
    }

    function espacios() {
        var t1 = document.getElementById("texto1").value;

        if (t1 !== "") {
            var resultado = "";

            for (var i = 0; i < t1.length; i++) {
                if (t1.charAt(i) !== " ") {
                    resultado = resultado + t1.charAt(i);
                }
            }

            document.getElementById("resultadoTextos").value = resultado;
        } else {
            alert("ingrese el primer texto");
        }
    }

    function insertar() {
        var t1 = document.getElementById("texto1").value;
        var t2 = document.getElementById("texto2").value;

        if (t1 !== "" && t2 !== "") {
            var mitad = Math.floor(t1.length / 2);
            var parte1 = "";
            var parte2 = "";

            for (var i = 0; i < t1.length; i++) {
                if (i < mitad) {
                    parte1 = parte1 + t1.charAt(i);
                } else {
                    parte2 = parte2 + t1.charAt(i);
                }
            }

            document.getElementById("resultadoTextos").value =
                parte1 + t2 + parte2;

        } else {
            alert("ingrese los dos textos");
        }
    }

    var numeros = [];

    function crear() {
        var texto = document.getElementById("vector").value;

        if (texto !== "") {
            var nuevoVector = [];
            var numero = "";
            var correcto = true;

            for (var i = 0; i <= texto.length; i++) {

                if (i < texto.length && texto[i] !== ",") {
                    numero = numero + texto[i];
                } else {
                    if (numero.trim() !== "" && !isNaN(Number(numero))) {
                        nuevoVector[nuevoVector.length] = Number(numero);
                        numero = "";
                    } else {
                        correcto = false;
                        break;
                    }
                }
            }

            if (correcto) {
                numeros = nuevoVector;
                document.getElementById("resultadoVector").value =
                    numeros.join(", ");
            } else {
                numeros = [];
                alert("ingrese numeros separados por comas");
            }

        } else {
            alert("Ingrese los numeros");
        }
    }

    function sumarVector() {
        if (numeros.length > 0) {
            var suma = 0;

            for (var i = 0; i < numeros.length; i++) {
                suma = suma + numeros[i];
            }

            document.getElementById("resultadoVector").value = suma;
        } else {
            alert("primero debe crear el vector");
        }
    }

    function pares() {
        if (numeros.length > 0) {
            var resultado = 1;
            var hayPares = false;

            for (var i = 0; i < numeros.length; i++) {
                if ((i + 1) % 2 === 0) {
                    resultado = resultado * numeros[i];
                    hayPares = true;
                }
            }

            if (hayPares) {
                document.getElementById("resultadoVector").value = resultado;
            } else {
                document.getElementById("resultadoVector").value =
                    "no hay posiciones pares";
            }
        } else {
            alert("primero debe crear el vector");
        }
    }

</script>

</body>
</html>
